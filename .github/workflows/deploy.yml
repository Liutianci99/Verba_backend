name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/liutianci99/verba-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Kokoro TTS 边车。内容极少变动,靠 buildx 层缓存 + GHCR 层去重,
  # 未改动时几乎不产生上传。
  build-tts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TTS image
        uses: docker/build-push-action@v6
        with:
          context: ./tts
          push: true
          tags: ghcr.io/liutianci99/verba-tts:latest
          cache-from: type=gha,scope=tts
          cache-to: type=gha,mode=max,scope=tts

  deploy:
    needs: [build-push, build-tts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /root/verba-backend/

      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER,DS_KEY
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /root/verba-backend
            # 用 CI 里的 DS_KEY 注入 DEEPSEEK_API_KEY,其余 .env(含 API_KEY)保留
            touch .env && chmod 600 .env
            if grep -q '^DEEPSEEK_API_KEY=' .env; then
              sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=${DS_KEY}|" .env
            else
              echo "DEEPSEEK_API_KEY=${DS_KEY}" >> .env
            fi
            # 不再往 .env 播种模型名:代码里已有默认值(config.ts),而 .env 一旦
            # 钉死就压过代码 —— 2026-07 DeepSeek 下线 deepseek-chat 时,正是这行
            # 留下的旧值让 /explain、/translate 持续 502,改代码部署也救不回来。
            # 这里只清掉已失效的钉子,需要覆盖的话手工写 DEEPSEEK_MODEL= 仍然有效。
            sed -i '/^DEEPSEEK_MODEL=deepseek-chat$/d' .env
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DS_KEY: ${{ secrets.DS_KEY }}
