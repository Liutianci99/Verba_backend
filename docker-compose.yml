services:
  verba-backend:
    image: docker.io/liustewart/verba-backend:latest
    container_name: verba-backend
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
